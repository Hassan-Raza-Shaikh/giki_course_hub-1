name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile base image
          python-version: '3.11'
      - run: pip install ruff==0.16.8
      - name: Check Python files compile
        run: python -m compileall -q -x 'node_modules' .
      # Only errors that break at runtime: syntax errors and undefined names
      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --output-format github --exclude frontend .
