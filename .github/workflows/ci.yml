name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile base image
          python-version: '3.11'
      - run: pip install ruff==0.16.8
      - name: Check Python files compile
        run: python -m compileall -q -x 'node_modules' .
      # Errors that break at runtime (syntax errors, undefined names) plus unused imports
      - name: Ruff (syntax errors, undefined names, unused imports)
        run: ruff check --select E9,F63,F7,F82,F401 --output-format github --exclude frontend .

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coursehub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest (throwaway Postgres built from migrations/)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coursehub_test
        run: pytest -q tests
