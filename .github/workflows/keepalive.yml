name: Keep Render Server Awake

on:
  schedule:
    # Runs every 10 minutes to prevent the Render free tier server from sleeping (sleeps after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Server
        # Must match the production Render URL (also the default baseURL in frontend/src/services/api.js).
        # -f fails the run on 4xx/5xx so a wrong URL shows up as a red run instead of a silent success.
        # --max-time 120 gives a sleeping backend time to cold-start.
        run: |
          curl -fsS --max-time 120 https://giki-course-hub-backend.onrender.com/api/courses/list > /dev/null
          echo "Successfully pinged the server to keep it awake."
